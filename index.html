<script>
/* ============================================================
   Helper & concurrency control
   - generate N proxies from template (replace {RAND})
   - test via https://api.ipify.org?format=json using axios proxy option
   - throttle requests in batches to avoid spamming browser/system
   - hide proxy strings in UI; keep them in memory to produce download
   ============================================================ */

const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

// build one proxy string from template (replace {RAND})
function buildProxy(tpl) {
  return tpl.replace(/{RAND}/g, String(randInt(111, 999)));
}

// parse proxy string into { username, password, host, port }
// expects format: authUser:authPass@host:port  (host may include dots)
function parseProxy(proxyStr) {
  const [authPart, hostPart] = proxyStr.split('@');
  const [username = '', password = ''] = (authPart || '').split(':');
  // hostPart may have multiple colons (rare) but last segment is port
  const hostParts = (hostPart || '').split(':');
  const port = hostParts.length > 1 ? hostParts.pop() : '';
  const host = hostParts.join(':') || '';
  return { username, password, host, port };
}

// Test one proxy using axios proxy option (http proxy)
async function testProxyAxios(proxyStr) {
  const parsed = parseProxy(proxyStr);
  if (!parsed.host || !parsed.port) return { ok: false, error: 'invalid-proxy' };

  try {
    // test API
    const res = await axios.get('https://api.ipify.org?format=json', {
      timeout: 8000,
      proxy: {
        protocol: 'http',
        host: parsed.host,
        port: parseInt(parsed.port, 10),
        auth: {
          username: parsed.username,
          password: parsed.password
        }
      }
    });
    // good response
    const ip = (res && res.data && (res.data.ip || res.data)) || String(res.data || '');
    return { ok: true, ip: ip };
  } catch (err) {
    // unify error message
    return { ok: false, error: (err && err.message) ? err.message : 'error' };
  }
}

// Throttled batch runner: runs tasks in batches of size `batchSize`
async function runInBatches(items, batchSize, workerFn, progressCallback) {
  const results = [];
  for (let i = 0; i < items.length; i += batchSize) {
    const batch = items.slice(i, i + batchSize);
    // start all promises in batch
    const promises = batch.map((it, idx) => workerFn(it, i + idx));
    const settled = await Promise.allSettled(promises);
    settled.forEach(s => results.push(s.status === 'fulfilled' ? s.value : { ok: false, error: s.reason && s.reason.message ? s.reason.message : String(s.reason) }));
    if (progressCallback) progressCallback(Math.min(i + batchSize, items.length));
    // small delay between batches to be polite
    await new Promise(r => setTimeout(r, 200)); 
  }
  return results;
}
