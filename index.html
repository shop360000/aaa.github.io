<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>GoLogin Fetch Tool + Proxy Checker</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 40px; background: #f7f9fb; }
    h1 { color: #1a73e8; }
    input, textarea { width: 100%; font-family: monospace; font-size: 14px; }
    textarea { height: 180px; }
    button { margin-top: 10px; padding: 10px 16px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #125bb5; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
    th { background: #f2f2f2; text-align: left; }
    #output { white-space: pre-wrap; background: #eee; padding: 10px; border-radius: 6px; margin-top: 10px; }
    .ok { color: green; font-weight: 600; }
    .fail { color: red; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🧩 GoLogin Fetch Parser + Bulk Creator + Proxy Live Checker</h1>

  <!-- 1️⃣ PHÂN TÍCH FETCH -->
  <div class="group">
    <h3>1️⃣ Phân tích đoạn fetch()</h3>
    <textarea id="fetchInput" placeholder="Dán fetch(...) ở đây..."></textarea>
    <button onclick="parseFetch()">Phân tích</button>
  </div>

  <!-- 2️⃣ LẤY PROFILE -->
  <div class="group">
    <h3>2️⃣ Lấy danh sách profile</h3>
    <button onclick="runApi()">Chạy API & Lưu Toàn Bộ TXT</button>
  </div>

  <!-- 3️⃣ TẠO PROFILE HÀNG LOẠT -->
  <div class="group">
    <h3>3️⃣ Tạo Profile Hàng Loạt</h3>
    <label>Nhập số lượng cần tạo (ví dụ 200):</label>
    <input type="number" id="createCount" value="200" min="1" max="10000" />
    <button onclick="bulkCreate()">Tạo Hàng Loạt</button>
  </div>

  <!-- 4️⃣ TẠO & KIỂM TRA PROXY -->
  <div class="group">
    <h3>4️⃣ Tạo Proxy Ngẫu Nhiên & Kiểm Tra Live</h3>
    <label>Template Proxy:</label>
    <input type="text" id="proxyTemplate"
      value="fightmobi_cpl-zone-custom-region-US-session-87706{RAND}-sessTime-15:PoJFMSoh4DuhHFGP@b51da4052a3e26e6.qzc.na.ipidea.online:2333" />

    <label>🔢 Số lượng proxy cần tạo:</label>
    <input type="number" id="proxyCount" value="10" min="1" max="200" />

    <button onclick="generateAndTestProxies()">🚀 Tạo & Kiểm Tra Proxy</button>

    <table id="proxyTable" style="display:none">
      <thead>
        <tr><th>#</th><th>Trạng thái</th><th>IP (nếu sống)</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <h3>📡 Log:</h3>
  <div id="output">Chưa chạy...</div>

  <script>
    // =============================================================
    // 🔹 PHÂN TÍCH FETCH()
    // =============================================================
    let parsedData = null;
    function parseFetch() {
      const input = document.getElementById("fetchInput").value.trim();
      if (!input) return alert("Vui lòng dán đoạn fetch()!");
      try {
        const urlMatch = input.match(/fetch\("(.*?)"/);
        const url = urlMatch ? urlMatch[1] : null;
        const jsonMatch = input.match(/{[\s\S]*}/);
        const jsonRaw = jsonMatch ? jsonMatch[0] : null;
        const jsonParsed = eval('(' + jsonRaw + ')');

        parsedData = {
          url,
          headers: jsonParsed.headers,
          method: jsonParsed.method || 'GET',
          body: jsonParsed.body || null,
          token: jsonParsed.headers['authorization']?.replace("Bearer ", "") || null
        };

        document.getElementById("output").innerText = "✅ Đã phân tích xong fetch().";
      } catch (err) {
        alert("Lỗi khi phân tích: " + err.message);
      }
    }

    // =============================================================
    // 🔹 LẤY TOÀN BỘ PROFILE
    // =============================================================
    async function runApi() {
      if (!parsedData) return alert("Chưa có dữ liệu!");
      const outputEl = document.getElementById("output");
      outputEl.innerText = "⏳ Đang tải danh sách profile...";
      try {
        let allProfiles = [];
        let offset = 0;
        const limit = 30;
        while (true) {
          const url = parsedData.url.replace(/limit=\d+/, `limit=${limit}`).replace(/offset=\d+/, `offset=${offset}`);
          const res = await axios.get(url, { headers: parsedData.headers });
          const data = res.data;
          if (data?.profiles?.length) {
            allProfiles.push(...data.profiles);
            offset += limit;
            outputEl.innerText = `✅ Lấy được ${allProfiles.length} profile...`;
            if (data.profiles.length < limit) break;
          } else break;
        }
        if (allProfiles.length > 0) {
          const lines = allProfiles.map(p => `${p.id} | ${p.name || ''}`).join("\n");
          const blob = new Blob([lines], { type: "text/plain" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "profiles_list.txt";
          a.click();
          outputEl.innerText += `\n📄 Đã tải ${allProfiles.length} profile.`;
        } else outputEl.innerText = "⚠️ Không tìm thấy profile.";
      } catch (err) {
        outputEl.innerText = "❌ Lỗi: " + (err.message || 'unknown');
      }
    }

    // =============================================================
    // 🔹 TẠO PROFILE HÀNG LOẠT
    // =============================================================
    async function bulkCreate() {
      if (!parsedData || parsedData.method !== 'POST')
        return alert("Hãy dán đoạn fetch() tạo profile trước!");
      const total = parseInt(document.getElementById("createCount").value) || 200;
      const outputEl = document.getElementById("output");
      outputEl.innerText = `🚀 Bắt đầu tạo ${total} profile...\n`;
      const body = JSON.parse(parsedData.body);
      let created = 0;
      while (created < total) {
        const customBody = { ...body, name: `${body.name || 'profile'}_${created + 1}` };
        await axios.post(parsedData.url, customBody, { headers: parsedData.headers }).catch(() => {});
        created++;
        outputEl.innerText = `✅ Đã tạo ${created}/${total}`;
      }
      outputEl.innerText += "\n🎉 Hoàn tất!";
    }

    // =============================================================
    // 🔹 SINH PROXY RANDOM + KIỂM TRA LIVE
    // =============================================================
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const buildProxy = tpl => tpl.replace("{RAND}", String(randInt(111, 999)));

    async function testProxy(proxyStr) {
      const [authPart, hostPart] = proxyStr.split("@");
      const [username, password] = authPart.split(":");
      const [host, port] = hostPart.split(":");
      try {
        const res = await axios.get("https://api.ipify.org?format=json", {
          timeout: 7000,
          proxy: {
            protocol: "http",
            host,
            port: parseInt(port),
            auth: { username, password }
          }
        });
        return { ok: true, ip: res.data.ip };
      } catch {
        return { ok: false, ip: "-" };
      }
    }

    async function generateAndTestProxies() {
      const tpl = document.getElementById("proxyTemplate").value.trim();
      const count = parseInt(document.getElementById("proxyCount").value) || 10;
      const tbody = document.querySelector("#proxyTable tbody");
      const output = document.getElementById("output");
      if (!tpl.includes("{RAND}")) return alert("Template phải chứa {RAND}!");

      tbody.innerHTML = "";
      document.getElementById("proxyTable").style.display = "table";
      output.innerText = `🔄 Đang tạo ${count} proxy và kiểm tra...`;

      const proxies = Array.from({ length: count }, () => buildProxy(tpl));
      const liveProxies = [];

      for (let i = 0; i < proxies.length; i++) {
        const result = await testProxy(proxies[i]);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td class="${result.ok ? 'ok' : 'fail'}">${result.ok ? 'LIVE' : 'DIE'}</td>
          <td>${result.ip}</td>
        `;
        tbody.appendChild(tr);
        if (result.ok) liveProxies.push(proxies[i]);
        output.innerText = `⏳ Đã kiểm tra ${i + 1}/${count} | Live: ${liveProxies.length}`;
      }

      // 🔽 Tự động tải file proxy live
      if (liveProxies.length > 0) {
        const blob = new Blob([liveProxies.join("\n")], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "proxy_live.txt";
        a.click();
      }

      output.innerText = `✅ Hoàn tất! ${liveProxies.length}/${count} proxy LIVE (đã tải file proxy_live.txt).`;
    }
  </script>
</body>
</html>
